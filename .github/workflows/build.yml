name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build APK + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PowerPlayer-v0.1.16.apk
          if gh release view v0.1.16 --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload v0.1.16 PowerPlayer-v0.1.16.apk app/build/outputs/apk/debug/app-debug.apk \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.16 PowerPlayer-v0.1.16.apk app/build/outputs/apk/debug/app-debug.apk \
              --title "PowerPlayer v0.1.16" \
              --notes "Волна переделана в движущуюся (дефолтный Waveseek Poweramp), а не статичную. Разбор по официальной справке Poweramp: у него два режима — Static Waveseek (вся песня зумом-аут, по ней едет линия прогресса, выглядит статично) и обычный, где тонкие бары волны скроллятся за НЕПОДВИЖНОЙ линией playhead. Теперь: окно 6с назад + 2с вперёд едет по треку, бары уезжают влево, линия стоит на месте в 75% ширины; слева белое сыгранное, справа серое непроигранное, граница цвета попиксельно по линии; за пределами трека — едва заметные точки 2dp. Данные — реальный пик амплитуды всего трека (analyzeTrack, 80мс-бакеты), так что едет настоящая форма песни, а не шум. Полоса едет непрерывно: animateFloatAsState 260мс Linear сглаживает 250мс-обновления поллера. Высоты баров не анимируются, столбец под линией не прыгает — двигается только таймлайн. Тап = перемотка в точку, драг = относительный сдвиг окна (как свайп по Waveseek в Poweramp). APK называется PowerPlayer-v0.1.16.apk." \
              --repo "${{ github.repository }}"
          fi
