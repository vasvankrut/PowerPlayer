name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build APK + Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.0-alpha --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload v0.1.0-alpha app/build/outputs/apk/debug/*.apk \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.0-alpha app/build/outputs/apk/debug/*.apk \
              --title "PowerPlayer v0.1.0 Alpha" \
              --notes "Чёрно-белый плеер. Выбор папки, MP3/FLAC, визуализация + перемотка по волне." \
              --repo "${{ github.repository }}"
          fi
