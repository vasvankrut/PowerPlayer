name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build APK + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PowerPlayer-v0.1.17.apk
          if gh release view v0.1.17 --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload v0.1.17 PowerPlayer-v0.1.17.apk app/build/outputs/apk/debug/app-debug.apk \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.17 PowerPlayer-v0.1.17.apk app/build/outputs/apk/debug/app-debug.apk \
              --title "PowerPlayer v0.1.17" \
              --notes "Два правки по обратной связи. 1) Линия playhead теперь РОВНО ПОСЕРЕДИНЕ полосы (50% ширины) — было 75%, а делящая палочка между сыгранным и несыгранным должна стоять по центру. Окно 8с: 4с яркой истории слева, 4с серого будущего справа. 2) Убрано дёрганье анимации. Раньше позиция приходила из поллера раз в 250мс и сглаживалась tween'ом, который перезапускался на каждом обновлении — скорость рвалась на стыках, лента дёргалась. Теперь лента живёт по собственным покадровым часам (withFrameNanos): каждый кадр позиция едет по реальному времени, а к реальной позиции поллера мягко подтягивается с малым усилением (0.03); перемотка дальше секунды гасится мгновенно, мелкие подстройки — плавно. Волна по-прежнему едет влево под неподвижной линией, высоты баров не анимируются, слева белое, справа серое, граница цвета попиксельно по линии. APK называется PowerPlayer-v0.1.17.apk." \
              --repo "${{ github.repository }}"
          fi
