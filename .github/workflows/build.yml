name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build APK + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PowerPlayer-v0.1.19.apk
          if gh release view v0.1.19 --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload v0.1.19 PowerPlayer-v0.1.19.apk app/build/outputs/apk/debug/app-debug.apk \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.19 PowerPlayer-v0.1.19.apk app/build/outputs/apk/debug/app-debug.apk \
              --title "PowerPlayer v0.1.19" \
              --notes "Три причины «резкого» движения волны и как они устранены. 1) Позиция от AudioTrack приходит ЛЕСТНИЦЕЙ — playbackHeadPosition обновляется ступенями по ~260мс (буфер ~46КБ), а поллер читает раз в 250мс. Прежняя подстройка гналась за этими ступенями рывками. Теперь: позиция продлевается вперёд на время с последнего опроса (появилась метка времени опроса positionStampNs), у подстройки появилась МЁРТВАЯ ЗОНА 120мс (рассогласования меньше неё вообще не трогаются — ступени остаются внутри зоны и лента едет ровно), а за её пределами лента догоняет постоянной небольшой скоростью 40мс/с. Перемотка — мгновенно. 2) Анимированная позиция больше не читается в теле композета: раньше каждый кадр шла полная рекомпозиция, теперь только перерисовка. 3) Высота бара больше не берётся как максимум по скользящему окну (он менялся ступеньками при прокрутке), а интерполируется по соседним бакетам — движение непрерывное. Линия playhead по-прежнему ровно посередине, волна едет влево под неподвижной линией, высоты баров не анимируются. APK называется PowerPlayer-v0.1.19.apk." \
              --repo "${{ github.repository }}"
          fi
