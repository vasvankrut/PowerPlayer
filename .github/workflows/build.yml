name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build APK + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PowerPlayer-v0.1.15.apk
          if gh release view v0.1.15 --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload v0.1.15 PowerPlayer-v0.1.15.apk app/build/outputs/apk/debug/app-debug.apk \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.15 PowerPlayer-v0.1.15.apk app/build/outputs/apk/debug/app-debug.apk \
              --title "PowerPlayer v0.1.15" \
              --notes "Волна как в Poweramp: весь трек сразу на всю ширину, симметричные тонкие бары (3dp + зазор 1.5dp) со скруглёнными концами, сыгранное белое (alpha 0.95), непроигранное серое (0.30), бар под playhead разрезан точно по границе цвета. Анализ трека переведён с RMS на пик амплитуды (max abs по 80мс-бакету) — форма сохраняет транзиенты, тихие места слегка подняты кривой 0.85. Скользящее окно ~6с убрано. Полоса волны стала низкой и широкой (112dp), кнопки перенесены под неё, таймкоды — под кнопки. Playhead едет плавно (animateFloatAsState 260мс Linear), живое свечение вокруг него следует за громкостью; высоты баров не анимируются. Тап/драг по любой точке волны = перемотка. APK называется PowerPlayer-v0.1.15.apk." \
              --repo "${{ github.repository }}"
          fi
