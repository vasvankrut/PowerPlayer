name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Build APK + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PowerPlayer-v0.1.12.apk
          if gh release view v0.1.12 --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload v0.1.12 PowerPlayer-v0.1.12.apk app/build/outputs/apk/debug/app-debug.apk \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v0.1.12 PowerPlayer-v0.1.12.apk app/build/outputs/apk/debug/app-debug.apk \
              --title "PowerPlayer v0.1.12" \
              --notes "Бегущая лента: исправлено сжатие волны к левому краю (убран коэффициент 1.002f в peakInWindow) и прыгающий серый забор справа (будущие слоты — плоские точки 1.5dp). APK называется PowerPlayer-v0.1.12.apk." \
              --repo "${{ github.repository }}"
          fi
